[project]
name = "volqen_saas"
authors = [{ name = "Volqen", email = "" }]
description = "Volqen ERP SaaS control plane for Frappe/ERPNext: website signups become Customers, and each Customer gets its own site, database and admin user."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
